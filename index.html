<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#FDFBF7">
    <title>Aura | Proaktif Yaşam Sistemi</title>
    <style>
        :root {
            /* Premium Zenginlik ve Sağlık Paleti */
            --bg-color: #FDFBF7; /* Sıcak krem, lüks hissiyat */
            --text-main: #2C3539; /* Kömür grisi, siyah kadar sert değil */
            --text-muted: #8B959A;
            
            /* Başlangıç (Yapılmadı - Yumuşak Kırmızı/Somon) */
            --red-bg: #FFF5F5;
            --red-border: #FCE8E8;
            --red-accent: #E5989B;
            --red-text: #C47376;
            
            /* Tamamlandı (Proaktif - Adaçayı Yeşili) */
            --green-bg: #F4F9F5;
            --green-border: #E3EFE6;
            --green-accent: #84A98C;
            --green-text: #52795B;
            
            --shadow-premium: 0 12px 36px rgba(0, 0, 0, 0.03);
            --transition-smooth: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Lüks Header ve Takvim */
        .header {
            padding: 45px 0 20px;
            background: var(--bg-color);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .brand-title {
            text-align: center;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 30px;
            color: var(--text-main);
        }

        .calendar-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .calendar-wrapper::before, .calendar-wrapper::after {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            width: 50px;
            z-index: 2;
            pointer-events: none;
        }
        .calendar-wrapper::before {
            left: 0;
            background: linear-gradient(to right, var(--bg-color), transparent);
        }
        .calendar-wrapper::after {
            right: 0;
            background: linear-gradient(to left, var(--bg-color), transparent);
        }

        .calendar-scroll {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
            -ms-overflow-style: none;
            padding: 10px calc(50% - 35px);
            scroll-behavior: smooth;
            gap: 15px;
            width: 100%;
        }

        .calendar-scroll::-webkit-scrollbar { display: none; }

        .date-item {
            flex: 0 0 70px;
            height: 85px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            scroll-snap-align: center;
            border-radius: 24px;
            cursor: pointer;
            transition: var(--transition-smooth);
            color: var(--text-muted);
        }

        .date-item .day-month {
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .date-item .day-num {
            font-size: 1.5rem;
            font-weight: 300;
        }

        .date-item.active {
            background-color: var(--text-main);
            color: #FFFFFF;
            transform: scale(1.1);
            box-shadow: 0 12px 24px rgba(44, 53, 57, 0.15);
        }
        .date-item.active .day-num { font-weight: 500; }

        /* Görev Kartları */
        .tasks-container {
            flex: 1;
            padding: 20px 25px 50px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            overflow-y: auto;
        }

        /* Yumuşak Kırmızı (Başlangıç) Durumu */
        .task-card {
            background-color: var(--red-bg);
            border: 1px solid var(--red-border);
            border-radius: 28px;
            padding: 22px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: var(--transition-smooth);
            box-shadow: var(--shadow-premium);
        }

        .task-card:active { transform: scale(0.96); }

        /* Adaçayı Yeşili (Tamamlandı) Durumu */
        .task-card.completed {
            background-color: var(--green-bg);
            border-color: var(--green-border);
        }

        .task-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
            pointer-events: none;
            width: 80%;
        }

        .task-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--red-text);
            transition: var(--transition-smooth);
        }

        .task-card.completed .task-title {
            color: var(--green-text);
        }

        .task-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        /* Rolex Mekanizması Hissiyatlı Buton */
        .check-circle {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid var(--red-accent);
            background: transparent;
            transition: var(--transition-smooth);
            position: relative;
            pointer-events: none;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .task-card.completed .check-circle {
            border-color: var(--green-accent);
            background: var(--green-accent);
            transform: rotate(360deg);
        }

        .task-card.completed .check-circle::after {
            content: '';
            width: 6px;
            height: 12px;
            border: solid white;
            border-width: 0 2.5px 2.5px 0;
            transform: rotate(45deg) translateY(-2px);
            opacity: 0;
            animation: checkmarkFade 0.4s 0.2s forwards;
        }

        @keyframes checkmarkFade {
            0% { opacity: 0; transform: rotate(45deg) translateY(-2px) scale(0.5); }
            100% { opacity: 1; transform: rotate(45deg) translateY(-2px) scale(1); }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div class="brand-title">Aura Doğal Yaşam</div>
        <div class="calendar-wrapper">
            <div class="calendar-scroll" id="calendar-scroll">
                <!-- JS ile günler buraya basılacak -->
            </div>
        </div>
    </div>
    
    <div class="tasks-container" id="tasks-container">
        <!-- JS ile görevler buraya basılacak -->
    </div>
</div>

<script>
    // Proaktif Yaşam Görevleri (Senin Belirlediğin Liste)
    const taskTemplates = [
        { id: 't1', title: 'Anatomik Farkındalık', desc: 'Duşta/banyo yaparken aynayla tüm vücut ve ben kontrolü yapıldı.' },
        { id: 't2', title: 'Doğal D Vitamini', desc: 'Sabah (09:00-10:00) kol içleri 10-15 dk güneşe gösterildi.' },
        { id: 't3', title: 'Hücresel Arınma', desc: 'Güneş kremi ve günün kiri ciltten tamamen arındırıldı, makyajsız uykuya geçildi.' }
    ];

    // LocalStorage (Uygulama kapansa bile verileri saklar)
    const STORAGE_KEY = 'aura_habit_tracker_db';
    let db = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
    
    const calendarScroll = document.getElementById('calendar-scroll');
    const tasksContainer = document.getElementById('tasks-container');
    const monthsTr = ['Oca', 'Şub', 'Mar', 'Nis', 'May', 'Haz', 'Tem', 'Ağu', 'Eyl', 'Eki', 'Kas', 'Ara'];
    
    let activeDateStr = '';

    // Veritabanını kaydetme fonksiyonu
    function saveDB() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
    }

    // Takvimi Oluştur (Geçmiş 15 gün - Bugün - Gelecek 15 gün)
    function initCalendar() {
        const today = new Date();
        let todayElement = null;

        for (let i = -15; i <= 15; i++) {
            let d = new Date();
            d.setDate(today.getDate() + i);
            
            // Saat farklarını ekarte etmek için yerel tarih stringi oluştur
            const dateStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            
            const dateEl = document.createElement('div');
            dateEl.className = 'date-item';
            dateEl.dataset.date = dateStr;
            
            dateEl.innerHTML = `
                <div class="day-month">${monthsTr[d.getMonth()]}</div>
                <div class="day-num">${d.getDate()}</div>
            `;
            
            dateEl.addEventListener('click', () => {
                dateEl.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            });

            calendarScroll.appendChild(dateEl);

            if (i === 0) todayElement = dateEl;
        }

        setTimeout(() => {
            if (todayElement) {
                todayElement.scrollIntoView({ behavior: 'auto', inline: 'center', block: 'nearest' });
            }
        }, 50);
    }

    // Görevleri Ekrana Çizme ve Renk Geçiş Mantığı
    function renderTasks(dateStr) {
        tasksContainer.innerHTML = '';
        
        // O güne ait veri yoksa, görevleri yapılmadı (false) olarak oluştur
        if (!db[dateStr]) {
            db[dateStr] = {};
            taskTemplates.forEach(t => db[dateStr][t.id] = false);
            saveDB();
        }
        
        const currentTasks = db[dateStr];

        taskTemplates.forEach(task => {
            const card = document.createElement('div');
            // Eğer tamamlandıysa 'completed' class'ı yeşil temayı aktifleştirir
            card.className = `task-card ${currentTasks[task.id] ? 'completed' : ''}`;
            
            card.innerHTML = `
                <div class="task-info">
                    <div class="task-title">${task.title}</div>
                    <div class="task-desc">${task.desc}</div>
                </div>
                <div class="check-circle"></div>
            `;

            // Tıklama ile Kırmızıdan Yeşile geçiş
            card.addEventListener('click', () => {
                const isCompleted = card.classList.toggle('completed');
                db[dateStr][task.id] = isCompleted;
                saveDB(); // Tıklamayı anında hafızaya kaydet
            });

            tasksContainer.appendChild(card);
        });
    }

    // Rolex Kadranı Akıllı Kaydırma
    let scrollTimeout;
    calendarScroll.addEventListener('scroll', () => {
        clearTimeout(scrollTimeout);
        scrollTimeout = setTimeout(() => {
            const center = calendarScroll.scrollLeft + (calendarScroll.clientWidth / 2);
            let closestEl = null;
            let closestDist = Infinity;

            document.querySelectorAll('.date-item').forEach(item => {
                const itemCenter = item.offsetLeft + (item.clientWidth / 2) - calendarScroll.offsetLeft;
                const dist = Math.abs(center - itemCenter);
                
                if (dist < closestDist) {
                    closestDist = dist;
                    closestEl = item;
                }
            });

            if (closestEl) {
                document.querySelectorAll('.date-item.active').forEach(el => el.classList.remove('active'));
                closestEl.classList.add('active');
                
                const newDateStr = closestEl.dataset.date;
                
                if (newDateStr !== activeDateStr) {
                    activeDateStr = newDateStr;
                    renderTasks(activeDateStr);
                }
            }
        }, 100); 
    });

    // Sayfa her açıldığında takvimi başlat
    initCalendar();

</script>
</body>
</html>
