<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#FAF9F6">
    <title>Aura | Habit Tracker</title>
    <style>
        :root {
            /* Minimalist, Shibumi felsefesine uygun pastel renk paleti */
            --bg-color: #FAF9F6;
            --card-bg: #FFFFFF;
            --text-main: #333333;
            --text-muted: #9CA3AF;
            
            /* Başlangıç (Yapılmadı) Durumu */
            --uncompleted-bg: #FCF4F4;
            --uncompleted-border: #F8EBEB;
            --uncompleted-circle: #E8C5C5;
            
            /* Tamamlandı Durumu */
            --completed-bg: #F4F9F6;
            --completed-border: #E8F1EC;
            --completed-circle: #C1D7D0;
            
            --shadow-subtle: 0 8px 24px rgba(0, 0, 0, 0.04);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* Mobil Uygulama Görünümü */
        .app-container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Üst Header ve Rolex Kadranı */
        .header {
            padding: 40px 0 15px;
            background: var(--bg-color);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .brand-title {
            text-align: center;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 25px;
            color: var(--text-main);
            opacity: 0.8;
        }

        .calendar-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        /* Kenarlardaki yumuşak geçiş efektleri (Gradient mask) */
        .calendar-wrapper::before, .calendar-wrapper::after {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            width: 40px;
            z-index: 2;
            pointer-events: none;
        }
        .calendar-wrapper::before {
            left: 0;
            background: linear-gradient(to right, var(--bg-color), transparent);
        }
        .calendar-wrapper::after {
            right: 0;
            background: linear-gradient(to left, var(--bg-color), transparent);
        }

        .calendar-scroll {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
            -ms-overflow-style: none;
            padding: 10px calc(50% - 32px); /* Elemanı tam ortaya almak için */
            scroll-behavior: smooth;
            gap: 12px;
            width: 100%;
        }

        .calendar-scroll::-webkit-scrollbar {
            display: none;
        }

        .date-item {
            flex: 0 0 64px;
            height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            scroll-snap-align: center;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            color: var(--text-muted);
        }

        .date-item .day-name {
            font-size: 0.7rem;
            font-weight: 500;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .date-item .day-num {
            font-size: 1.4rem;
            font-weight: 400;
        }

        /* Aktif Gün Vurgusu */
        .date-item.active {
            background-color: var(--text-main);
            color: #FFFFFF;
            transform: scale(1.1);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        /* Görev Kartları Listesi */
        .tasks-container {
            flex: 1;
            padding: 20px 24px 40px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
        }

        .task-card {
            background-color: var(--uncompleted-bg);
            border: 1px solid var(--uncompleted-border);
            border-radius: 24px;
            padding: 20px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: var(--shadow-subtle);
        }

        /* Dokunma hissiyatı */
        .task-card:active {
            transform: scale(0.97);
        }

        .task-card.completed {
            background-color: var(--completed-bg);
            border-color: var(--completed-border);
        }

        .task-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            pointer-events: none;
        }

        .task-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
            transition: color 0.3s;
        }

        .task-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.3;
        }

        /* Animasyonlu Check Butonu */
        .check-circle {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid var(--uncompleted-circle);
            background: transparent;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            position: relative;
            pointer-events: none;
            flex-shrink: 0;
            margin-left: 16px;
        }

        .task-card.completed .check-circle {
            border-color: var(--completed-circle);
            background: var(--completed-circle);
            transform: rotate(360deg);
        }

        .task-card.completed .check-circle::after {
            content: '';
            position: absolute;
            top: 6px;
            left: 9px;
            width: 4px;
            height: 10px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
            opacity: 0;
            animation: checkmarkFade 0.3s 0.2s forwards;
        }

        @keyframes checkmarkFade {
            0% { opacity: 0; transform: rotate(45deg) scale(0.5); }
            100% { opacity: 1; transform: rotate(45deg) scale(1); }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div class="brand-title">Core & Aura</div>
        <div class="calendar-wrapper">
            <div class="calendar-scroll" id="calendar-scroll">
                <!-- JS ile günler buraya basılacak -->
            </div>
        </div>
    </div>
    
    <div class="tasks-container" id="tasks-container">
        <!-- JS ile görevler buraya basılacak -->
    </div>
</div>

<script>
    // Kişisel Alışkanlıklar ve Görev Listesi
    const taskTemplates = [
        { id: 't1', title: 'Güneş Kremi & Bariyer Onarımı', desc: 'UV koruması ve temel nem bariyeri desteği' },
        { id: 't2', title: 'Manuel Lenf Masajı', desc: 'Yüz ve boyun bölgesi ödem/toksin atımı' },
        { id: 't3', title: 'Yarım Ölü Böcek & Köprü', desc: 'Merkez bölge stabilizasyonu ve fiziksel aktivasyon' },
        { id: 't4', title: 'Saç Derisi & Dalga Koruma', desc: 'Saç derisi tonik bakımı ve doğal dalga formunu koruma' },
        { id: 't5', title: 'Hücresel Hidrasyon', desc: 'Günlük hedeflenen temiz su tüketimi' }
    ];

    // Günlük verilerin geçici olarak tutulacağı hafıza
    const db = {}; 
    const calendarScroll = document.getElementById('calendar-scroll');
    const tasksContainer = document.getElementById('tasks-container');
    const daysTr = ['Paz', 'Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt'];
    
    let activeDateStr = '';

    // Takvimi Oluştur (Geçmiş 15 gün - Bugün - Gelecek 15 gün)
    function initCalendar() {
        const today = new Date();
        let todayElement = null;

        for (let i = -15; i <= 15; i++) {
            let d = new Date();
            d.setDate(today.getDate() + i);
            const dateStr = d.toISOString().split('T')[0]; // YYYY-MM-DD formatı
            
            const dateEl = document.createElement('div');
            dateEl.className = 'date-item';
            dateEl.dataset.date = dateStr;
            
            dateEl.innerHTML = `
                <div class="day-name">${daysTr[d.getDay()]}</div>
                <div class="day-num">${d.getDate()}</div>
            `;
            
            // Tıklayınca pürüzsüz merkeze kaydırma
            dateEl.addEventListener('click', () => {
                dateEl.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            });

            calendarScroll.appendChild(dateEl);

            if (i === 0) todayElement = dateEl;
        }

        // Sayfa yüklendiğinde bugünü merkeze al
        setTimeout(() => {
            if (todayElement) {
                todayElement.scrollIntoView({ behavior: 'auto', inline: 'center', block: 'nearest' });
            }
        }, 50);
    }

    // Görevleri Ekrana Çizme Mantığı
    function renderTasks(dateStr) {
        tasksContainer.innerHTML = '';
        
        // Eğer o güne ait daha önce oluşturulmuş bir veri yoksa sıfırdan oluştur
        if (!db[dateStr]) {
            db[dateStr] = {};
            taskTemplates.forEach(t => db[dateStr][t.id] = false);
        }
        
        const currentTasks = db[dateStr];

        taskTemplates.forEach(task => {
            const card = document.createElement('div');
            card.className = `task-card ${currentTasks[task.id] ? 'completed' : ''}`;
            
            card.innerHTML = `
                <div class="task-info">
                    <div class="task-title">${task.title}</div>
                    <div class="task-desc">${task.desc}</div>
                </div>
                <div class="check-circle"></div>
            `;

            // Dopamin Animasyonu: Tıklandığında durumu değiştir
            card.addEventListener('click', () => {
                const isCompleted = card.classList.toggle('completed');
                db[dateStr][task.id] = isCompleted;
            });

            tasksContainer.appendChild(card);
        });
    }

    // Rolex Kadranı Kaydırma (Scroll) Algılayıcı
    let scrollTimeout;
    calendarScroll.addEventListener('scroll', () => {
        clearTimeout(scrollTimeout);
        scrollTimeout = setTimeout(() => {
            const center = calendarScroll.scrollLeft + (calendarScroll.clientWidth / 2);
            let closestEl = null;
            let closestDist = Infinity;

            // Ekranın merkezine en yakın olan tarihi bul
            document.querySelectorAll('.date-item').forEach(item => {
                const itemCenter = item.offsetLeft + (item.clientWidth / 2) - calendarScroll.offsetLeft;
                const dist = Math.abs(center - itemCenter);
                
                if (dist < closestDist) {
                    closestDist = dist;
                    closestEl = item;
                }
            });

            if (closestEl) {
                document.querySelectorAll('.date-item.active').forEach(el => el.classList.remove('active'));
                closestEl.classList.add('active');
                
                const newDateStr = closestEl.dataset.date;
                
                // Gün değiştiyse görevleri o güne göre tazele
                if (newDateStr !== activeDateStr) {
                    activeDateStr = newDateStr;
                    renderTasks(activeDateStr);
                }
            }
        }, 100); 
    });

    // Başlat
    initCalendar();

</script>
</body>
</html>
